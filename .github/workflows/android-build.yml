name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        type: choice
        options:
          - debug
          - release
        default: debug
        required: false
  push:
    branches:
      - release/v1

permissions:
  contents: read

jobs:
  android:
    name: Build Motofix Driver Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/motofix-driver-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interfaces/motofix-driver-app/package-lock.json

      - name: Create production environment file
        env:
          VITE_API_AUTH_URL: ${{ vars.VITE_API_AUTH_URL || secrets.VITE_API_AUTH_URL || 'https://motofix-auth.onrender.com' }}
          VITE_API_MATCHING_URL: ${{ vars.VITE_API_MATCHING_URL || secrets.VITE_API_MATCHING_URL || 'https://motofix-matching.onrender.com' }}
          VITE_API_REQUESTS_URL: ${{ vars.VITE_API_REQUESTS_URL || secrets.VITE_API_REQUESTS_URL || 'https://motofix-dispatch.onrender.com' }}
          VITE_API_MECHANICS_URL: ${{ vars.VITE_API_MECHANICS_URL || secrets.VITE_API_MECHANICS_URL || 'https://motofix-verification.onrender.com' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || secrets.VITE_WS_URL || 'wss://motofix-dispatch.onrender.com/ws/jobs' }}
          VITE_PROVIDER_URL: ${{ vars.VITE_PROVIDER_URL || secrets.VITE_PROVIDER_URL || 'https://motofixug.netlify.app' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_MOTOBOT_ENABLED: "false"
        shell: bash
        run: |
          vars=(
            VITE_API_AUTH_URL VITE_API_MATCHING_URL VITE_API_REQUESTS_URL
            VITE_API_MECHANICS_URL VITE_WS_URL VITE_PROVIDER_URL
          )
          : > .env.production
          for name in "${vars[@]}"; do
            value="${!name}"
            case "$name" in
              VITE_WS_URL)
                case "$value" in
                  wss://*) ;;
                  *) echo "::error::$name must use wss:// for production builds."; exit 1 ;;
                esac
                ;;
              *)
                case "$value" in
                  https://*) ;;
                  *) echo "::error::$name must use https:// for production builds."; exit 1 ;;
                esac
                ;;
            esac
            case "$value" in
              *localhost*|*127.0.0.1*)
                echo "::error::$name must not point to localhost."; exit 1
                ;;
            esac
            printf '%s=%s\n' "$name" "$value" >> .env.production
          done
          for name in VITE_GOOGLE_MAPS_API_KEY VITE_GOOGLE_MAPS_MAP_ID \
            VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID VITE_FIREBASE_VAPID_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env.production
            fi
          done
          printf 'VITE_MOTOBOT_ENABLED=false\n' >> .env.production

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify web assets before Capacitor sync
        run: |
          test -s dist/index.html || {
            echo "::error::Vite build did not create dist/index.html."
            exit 1
          }
          echo "Vite output exists: $(find dist -type f | wc -l) files in dist/." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Android project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android || {
              echo "::error::Capacitor could not generate the Android project. Check capacitor.config.ts and the Capacitor dependencies."
              exit 1
            }
          fi

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android || {
            echo "::error::Capacitor could not sync the Android project. Check the app build output and Capacitor configuration."
            exit 1
          }
          test -s android/app/src/main/assets/public/index.html || {
            echo "::error::Capacitor did not copy dist/index.html into the Android web assets."
            exit 1
          }
          echo "Capacitor sync copied dist/ into android/app/src/main/assets/public/." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: github.event_name == 'push' || inputs.build_type == 'debug'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release builds require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/motofix-release.keystore"
          test -s "$RUNNER_TEMP/motofix-release.keystore" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore."
            exit 1
          }

      - name: Build signed release APK and AAB
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/motofix-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload debug APK
        if: github.event_name == 'push' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: motofix-driver-debug-apk
          path: interfaces/motofix-driver-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK and AAB
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: motofix-driver-release-apk-aab
          path: |
            interfaces/motofix-driver-app/android/app/build/outputs/apk/release/app-release.apk
            interfaces/motofix-driver-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14