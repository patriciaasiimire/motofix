# Run from Actions > Android Build > Run workflow. Debug APKs need no signing secrets.
# Release signing needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. Optional VITE_* secrets are mapped below.
# Native Android may be generated on this runner; developers do not run cap add android or Gradle locally.
name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        type: choice
        options:
          - debug
          - release
        default: debug
        required: false
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: Build Motofix Driver Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/motofix-driver-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interfaces/motofix-driver-app/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Create production environment file
        env:
          VITE_API_AUTH_URL: ${{ secrets.VITE_API_AUTH_URL }}
          VITE_API_REQUESTS_URL: ${{ secrets.VITE_API_REQUESTS_URL }}
          VITE_API_PAYMENTS_URL: ${{ secrets.VITE_API_PAYMENTS_URL }}
          VITE_API_DIAGNOSIS_URL: ${{ secrets.VITE_API_DIAGNOSIS_URL }}
          VITE_API_MATCHING_URL: ${{ secrets.VITE_API_MATCHING_URL }}
          VITE_API_INSURANCE_URL: ${{ secrets.VITE_API_INSURANCE_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_PROVIDER_URL: ${{ secrets.VITE_PROVIDER_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        shell: bash
        run: |
          vars=(
            VITE_API_AUTH_URL VITE_API_REQUESTS_URL VITE_API_PAYMENTS_URL
            VITE_API_DIAGNOSIS_URL VITE_API_MATCHING_URL VITE_API_INSURANCE_URL
            VITE_WS_URL VITE_PROVIDER_URL VITE_GOOGLE_MAPS_API_KEY
            VITE_GOOGLE_MAPS_MAP_ID VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID
            VITE_FIREBASE_VAPID_KEY
          )
          : > .env.production
          for name in "${vars[@]}"; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env.production
            fi
          done
          if [ ! -s .env.production ]; then
            rm .env.production
            echo "No VITE_* secrets provided; Vite defaults will be used."
          fi

      - name: Build web app
        run: npm run build

      - name: Install Capacitor on runner
        run: npm install --no-save --package-lock=false @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7

      - name: Initialize Capacitor config if missing
        shell: bash
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "MotoFix Driver" "org.motofix.driver" --web-dir dist
          fi

      - name: Generate Android project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ] || [ -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" ] || [ -n "$ANDROID_DEBUG_KEY_ALIAS" ] || [ -n "$ANDROID_DEBUG_KEY_PASSWORD" ]; then
            if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ] || [ -z "$ANDROID_DEBUG_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_DEBUG_KEY_ALIAS" ] || [ -z "$ANDROID_DEBUG_KEY_PASSWORD" ]; then
              echo "::error::Set all four ANDROID_DEBUG_* signing secrets to use a stable debug certificate."
              exit 1
            fi
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/motofix-debug.keystore"
            ./gradlew assembleDebug \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/motofix-debug.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_DEBUG_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_DEBUG_KEY_PASSWORD"
          else
            ./gradlew assembleDebug
          fi

      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and the other Android signing secrets to build a release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/motofix-release.keystore"

      - name: Build signed release APK and AAB
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD for release signing."
            exit 1
          fi
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/motofix-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: motofix-driver-debug-apk
          path: interfaces/motofix-driver-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK and AAB
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: motofix-driver-release-apk-aab
          path: |
            interfaces/motofix-driver-app/android/app/build/outputs/apk/release/app-release.apk
            interfaces/motofix-driver-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14