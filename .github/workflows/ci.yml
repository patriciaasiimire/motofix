name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            directory: services/motofix-auth-service
            tests: tests
            database_url: postgresql://postgres:password@localhost:5433/motofix_ci
          - service: verification
            directory: services/motofix-verification-service
            tests: tests
            database_url: sqlite:///./test.db
          - service: matching
            directory: services/motofix-matching-service
            tests: tests
            database_url: postgresql://postgres:password@localhost:5433/motofix_ci
          - service: diagnosis
            directory: services/motofix-diagnosis-service
            tests: tests
            database_url: sqlite:///./test.db
          - service: dispatch
            directory: services/motofix-dispatch-service
            tests: tests
            database_url: postgresql://postgres:password@localhost:5433/motofix_ci
          - service: analytics
            directory: services/motofix-analytics-service
            tests: tests
            database_url: postgresql://postgres:password@localhost:5433/motofix_ci
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt
      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run service tests
        env:
          SECRET_KEY: ci-test-secret
          ADMIN_JWT_SECRET: ci-test-secret
          DATABASE_URL: ${{ matrix.database_url }}
        run: python -m pytest "${{ matrix.tests }}" -q

  syntax-check:
    name: Compile Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q services
