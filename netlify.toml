# The Base directory set in the Netlify UI uses a Windows-style backslash
# ("interfaces\motofix-driver-app"), which does not resolve on Netlify's Linux
# build image. Setting it here overrides the UI value.
[build]
  base = "interfaces/motofix-driver-app"
  command = "npm install --include=dev && npm run build"
  publish = "dist"

# Single-page app: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
